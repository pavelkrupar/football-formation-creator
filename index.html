<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football Formation Creator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div>
            <h1 id="app-title">Football Formation Creator</h1>
          </div>
        </div>

        <div class="lang-picker" id="lang-picker" aria-label="Choose language">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="cs">CS</button>
        </div>
      </header>

      <main class="main-grid">
        <section class="pitch-panel">
          <div class="panel-header">
            <div class="formation-picker" id="formation-picker" aria-label="Choose formation">
              <button class="formation-btn active" data-formation="4-3-3">4-3-3</button>
              <button class="formation-btn" data-formation="4-4-2">4-4-2</button>
              <button class="formation-btn" data-formation="3-4-3">3-4-3</button>
              <button class="formation-btn" data-formation="4-2-3-1">4-2-3-1</button>
            </div>

            <div class="panel-header-actions">
              <div class="captain-picker-wrap">
                <select id="captain-select" class="captain-select" aria-label="Pick team captain">
                  <option value="">Pick a captain</option>
                </select>
              </div>

              <button type="button" id="reset-lineup-btn" class="reset-btn" title="Remove all players from the lineup">
                Clear lineup
              </button>
            </div>
          </div>

          <div class="pitch" id="pitch">
            <div class="pitch-halo"></div>
            <div class="center-circle"></div>
            <div class="center-line"></div>
            <div class="penalty-box left"></div>
            <div class="penalty-box right"></div>
            <div class="goal-box left"></div>
            <div class="goal-box right"></div>
            <div id="field-grid" class="field-grid" aria-hidden="true"></div>
            <div id="field-positions" class="field-positions"></div>
          </div>
        </section>

        <aside class="players-panel">
          <div class="panel-header compact">
            <div>
              <h2 id="lineup-heading">Player list</h2>
            </div>
          </div>

          <div id="club-filter" class="club-filter" role="group" aria-label="Team filter"></div>

          <input type="search" id="player-search" class="player-search" placeholder="Search players..." aria-label="Search players" />

          <div id="players-list" class="players-list" aria-live="polite"></div>
        </aside>
      </main>
    </div>

    <footer class="app-footer" id="app-footer">Created by Pavel Krupař with Claude Code and GitHub Copilot</footer>

    <div id="drag-preview" class="drag-preview" aria-hidden="true">
      <img id="drag-preview-photo" class="drag-preview-photo" src="" alt="" />
      <span id="drag-preview-name" class="drag-preview-name"></span>
    </div>

    <script src="data.js"></script>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
  </body>
</html>
